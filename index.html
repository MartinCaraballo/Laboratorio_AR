<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Búsqueda del Tesoro - Sacré Coeur (AR.js + A-Frame)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #hud {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 8px 10px;
            border-radius: 8px;
        }

        #finalOverlay {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(0, 0, 0, 0.6);
            z-index: 20;
        }

        #finalCard {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 90%;
        }
    </style>
</head>
<body>
<div id="hud">Marcadores encontrados: <span id="count">0</span>/3</div>

<div id="finalOverlay">
    <div id="finalCard">
        <h1>¡Tesoro encontrado! 🏆</h1>
        <p>Felicidades — completaste la búsqueda en el Edificio Sacré Coeur.</p>
        <button id="replay">Jugar otra vez</button>
    </div>
</div>

<a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Assets -->
    <a-assets>
        <!-- ejemplo de modelo glTF (puedes subir tu propio archivo .glb al repo y reemplazar la URL) -->
        <!-- <a-asset-item id="treasureGLB" src="assets/treasure.glb"></a-asset-item> -->
        <audio id="winSound" src="assets/win.mp3"></audio>
    </a-assets>

    <!-- Marcador 1: hiro (ejemplo) -->
    <a-marker preset="hiro" id="marker-hiro">
        <a-box position="0 0.5 0" rotation="0 45 0" scale="0.5 0.5 0.5"
               animation="property: rotation; to: 0 405 0; loop: true; dur: 7000"></a-box>
        <a-text value="Pista 1: Busca la estatua en el hall" position="-0.8 1 0" rotation="-90 0 0"
                scale="2 2 2"></a-text>
    </a-marker>

    <!-- Marcador 2: kanji (ejemplo) -->
    <a-marker preset="kanji" id="marker-kanji">
        <a-cylinder position="0 0.5 0" radius="0.3" height="0.8" rotation="0 0 0"
                    animation="property: scale; dir: alternate; dur: 1000; to: 1.1 1.1 1.1; loop: true"></a-cylinder>
        <a-text value="Pista 2: Sube al segundo piso" position="-0.8 1 0" rotation="-90 0 0" scale="2 2 2"></a-text>
    </a-marker>

    <!-- Marcador 3: custom marker (pattern file) -->
    <!-- Genera pattern-treasure.patt y súbelo a tu repo en /assets/patterns/ -->
    <a-marker type="pattern" url="assets/patterns/pattern-treasure.patt" id="marker-treasure">
        <!-- Si tienes un glTF, instálalo aquí -->
        <!-- <a-entity gltf-model="#treasureGLB" scale="0.3 0.3 0.3" position="0 0 0"></a-entity> -->
        <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.3"
                animation="property: scale; dir: alternate; dur: 800; to: 1.2 1.2 1.2; loop: true"></a-ring>
        <a-text value="Pista 3: Mira detrás del mural" position="-0.8 1 0" rotation="-90 0 0" scale="2 2 2"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<script>
    // Lógica de progreso
    const markers = {
        'marker-hiro': false,
        'marker-kanji': false,
        'marker-treasure': false
    };

    const countEl = document.getElementById('count');
    const finalOverlay = document.getElementById('finalOverlay');
    const winSound = document.getElementById('winSound');

    function updateCount() {
        const found = Object.values(markers).filter(Boolean).length;
        countEl.textContent = found;
        if (found === 3) showFinal();
    }

    function showFinal() {
        // reproducir sonido si existe
        if (winSound) {
            try {
                winSound.play();
            } catch (e) { /* autoplay restrictions on some browsers */
            }
        }
        // animación/overlay final
        finalOverlay.style.display = 'grid';
    }

    document.getElementById('replay').addEventListener('click', () => {
        // reset
        for (let k in markers) markers[k] = false;
        finalOverlay.style.display = 'none';
        updateCount();
    });

    // Registrar eventos markerFound/markerLost
    Object.keys(markers).forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('markerFound', () => {
            if (!markers[id]) {
                markers[id] = true;
                // feedback rápido: escalar entidad, etc.
                el.emit && el.emit('found'); // opcional
                updateCount();
                // opcional: mostrar mensaje breve
                console.log('Encontrado:', id);
            }
        });
        el.addEventListener('markerLost', () => {
            // No restamos el progreso para que el jugador pueda mover la cámara: decisión de diseño.
            console.log('Perdido:', id);
        });
    });
</script>
</body>
</html>
